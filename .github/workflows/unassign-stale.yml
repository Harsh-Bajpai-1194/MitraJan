name: Unassign Stale Claims

on:
  schedule:
    # This cron schedule means the action runs automatically at the top of every hour
    - cron: '0 * * * *'
  # Allows you to trigger this workflow manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  unassign-stale:
    permissions:
      issues: write
      pull-requests: read # Required to read the PR nodes in GraphQL
    runs-on: ubuntu-latest
    steps:
      - name: Check and unassign stale issues
        uses: actions/github-script@v6
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const now = new Date();
            const STALE_HOURS = 24; // Time limit in hours
            
            // 1. Get all currently open issues (using pagination to get ALL issues)
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });
            
            for (const issue of issues) {
              // Skip if it's actually a Pull Request or if nobody is assigned
              if (issue.pull_request || !issue.assignees || issue.assignees.length === 0) continue;
              
              // 2. Fetch the REST activity history to find assignment timestamps
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              
              // 3. Find exactly when it was last assigned
              const assignedEvents = events.filter(e => e.event === 'assigned');
              if (assignedEvents.length === 0) continue;
              
              const lastAssignedEvent = assignedEvents[assignedEvents.length - 1];
              const lastAssigned = new Date(lastAssignedEvent.created_at);
              const hoursSinceAssigned = (now - lastAssigned) / (1000 * 60 * 60);
              
              // If it hasn't been 24 hours yet, skip to the next issue to save API quota
              if (hoursSinceAssigned < STALE_HOURS) continue;
              
              // 4. Use GraphQL to robustly check for linked Pull Requests
              // This natively captures PRs linked via the GitHub UI sidebar (ConnectedEvent)
              const query = `
                query($owner: String!, $repo: String!, $issue_number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $issue_number) {
                      timelineItems(itemTypes: [CROSS_REFERENCED_EVENT, CONNECTED_EVENT], last: 50) {
                        nodes {
                          __typename
                          ... on CrossReferencedEvent {
                            createdAt
                            source {
                              ... on PullRequest {
                                number
                              }
                            }
                          }
                          ... on ConnectedEvent {
                            createdAt
                            source {
                              ... on PullRequest {
                                number
                              }
                            }
                            subject {
                              ... on PullRequest {
                                number
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              `;
              
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number
              });
              
              const timelineNodes = result.repository.issue.timelineItems.nodes;
              
              // Check if a PR was linked AFTER the user was assigned
              const hasPRLinked = timelineNodes.some(node => {
                const eventDate = new Date(node.createdAt);
                if (eventDate > lastAssigned) {
                  if (node.__typename === 'CrossReferencedEvent' && node.source && node.source.number) return true;
                  if (node.__typename === 'ConnectedEvent' && ((node.source && node.source.number) || (node.subject && node.subject.number))) return true;
                }
                return false;
              });
              
              // 5. If 24 hours have passed AND no PR is linked, remove them!
              if (!hasPRLinked) {
                const assigneesToRemove = issue.assignees.map(a => a.login);
                
                // Unassign the users
                await github.rest.issues.removeAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: assigneesToRemove
                });
                
                // Leave a friendly automated comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `⏳ **Time's up!** It has been over 24 hours since this issue was claimed, and no Pull Request has been linked.\n\nI am automatically unassigning this issue so others can have a chance to work on it! If you're still working on it, feel free to \`/claim\` it again. 🐍`
                });
              }
            }
